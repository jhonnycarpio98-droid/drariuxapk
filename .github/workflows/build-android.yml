name: Build Android APK

# Compila el bundle web (Vite) y genera el APK de depuración con Gradle en un
# runner de GitHub (tu PC no compila nada pesado). El APK queda como Artifact.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # La URL del motor se lee de la Variable de repo "API_BASE_URL"
      # (Settings → Secrets and variables → Actions → Variables). Si no está
      # definida, cae a un placeholder: la APK compila pero no tendrá server.
      - name: Build web bundle
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://civitas.drariux.network/api' }}
        run: npm run build

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # android/ está gitignorado: se regenera desde Capacitor en el runner.
      - name: Add + sync Capacitor Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: civitas-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
